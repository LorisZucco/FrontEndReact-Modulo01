<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles/index.style.css">
    <title>Pet-Shop</title>
</head>

<body>
    <header>
        <div class="links">
            <a href="#">Inicio</a>
            <a href="#">Produtos</a>
            <a href="#">Banho e tosa</a>
            <a href="#">Contato</a>
            <a href="#">Adoção</a>
            <a href="#">Blog</a>
        </div>
        <div class="brand">
            <h1>Happy Pets</h1>
            <button>Entrar</button>
        </div>
    </header>
    <div class="search">
        <input class="search-field" type="text" placeholder="Buscar Produto">
        <button class="search-button">Buscar</button>
    </div>

    <h2>Banho e Tosa</h2>
    <div class="services">
        <div class="service">
            <h3 class="service-name">Banho</h3>
            <p class="service-price">R$ 60</p>
            <p class="service-note">até 10kg</p>
        </div>
        <div class="service featured">
            <h3 class="service-name">Banho + Tosa</h3>
            <p class="service-price">R$ 95</p>
            <p class="service-note">o mais pedido</p>
        </div>
    </div>

    <h2>Produtos</h2>
    <div class="products">
        <div class="card">
            <h3 class="card-title">Ração Seca 2kg</h3>
            <p class="card-description">Caes adultos.Sabor Frango</p>
            <div class="card-footer">
                <p class="card-price">R$ 89,90</p>
                <button class="card-button">Comprar</button>
            </div>
        </div>
        <div class="card">
            <h3 class="card-title">Coleira</h3>
            <p class="card-description">Couro Ajustável</p>
            <div class="card-footer">
                <p class="card-price">R$ 39,90</p>
                <button class="card-button">Comprar</button>
            </div>
        </div </div>
        <script src="./assets/scripts/index.script.js"></script>
</body>

</html>
