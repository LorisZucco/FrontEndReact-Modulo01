<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Títulos e textos</title>
  </head>

  <body>
    <!-- TAGS DE TITULOS NO HTML -->
    <h1>Texto Principal</h1>
    <h2>Titulo Secundário</h2>
    <h3>Texto com um grau de importância moderado</h3>

    <h4>Texto com h4</h4>
    <h5>Texto com h5</h5>
    <h6>Texto com h6</h6>

    <hr />

    <!-- TAGS PRÓPRIAS DE TEXTO -->

    <p>
      <strong>Parágrafo</strong><br />
      <em>Simples</em> de texto <span>Tag Span</span> Meuzo
    </p>
  </body>
</html>
