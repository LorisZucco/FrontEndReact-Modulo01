<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários - Javascript</title>
    <link rel="stylesheet" href="./assets/styles/index.styles.css">
</head>

<body>
    <h3>Formulários - Javascript</h3>
    <p>Cadastro de Perfil</p>
    <form>
        <div>
            <label for="name">Digite o seu nome</label>
            <input id="name" name="name" type="text">
        </div>
        <div>
            <label for="age">Digite a sua idade</label>
            <input id="age" name="age" type="number">
        </div>
        <div>
            <label for="studentLevel">Selecione seu nível de graduação</label>
            <select name="studentLevel" id="studentLevel">
                <option value="">Selecione</option>
                <option value="em">Ensino Médio</option>
                <option value="sup">Ensino Sup</option>
                <option value="pos">Pós Graduação</option>
            </select>
        </div>
        <div>
            <label for="terms">Li e aceito termos de uso</label>
            <input type="checkbox" id="terms" name="terms">
        </div>
        <div>
            <label for="politics">Li e aceito políticas de privacidade</label>
            <input type="checkbox" id="politics" name="politics">
        </div>
        <fieldset>
            <legend>Selecione o gênero que você se identifica</legend>
            <label for="male">Masculino</label>
            <input id="male" name="gender" type="radio" value="Masculino">
            <label for="female">Feminino</label>
            <input id="female" name="gender" type="radio" value="Feminino">
        </fieldset>

        <button>Cadastrar</button>
        <p id="success"></p>
        <div id="userData">

        </div>
    </form>

    <script src="./assets/scripts/index.script.js"></script>
</body>

</html>
